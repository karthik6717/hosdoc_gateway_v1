spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS} 
            allowedMethods:
              - GET
              - POST
              - DELETE
              - PUT
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
             
        - id: backend-service
          uri: ${BACKEND_SERVICE_URL}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
            - name: JwtValidationFilter
        
        # Swagger UI routes (exclude from JWT validation)
        - id: swagger-ui
          uri: ${BACKEND_SERVICE_URL:lb://HOSDOC-BACKEND}
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/swagger-resources/**
          filters:
            - StripPrefix=0

  main:
    allow-circular-references: true         

  application:
   name: hosdoc-gateway

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    # Retry configuration to handle Eureka connection issues gracefully
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    
server:
  port: ${PORT:8080}

# Health check configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

